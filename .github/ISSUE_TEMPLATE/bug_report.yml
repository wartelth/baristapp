name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail so we can reproduce quickly.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What did you expect vs what happened?
      placeholder: A clear and concise description.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - app
        - server
        - shared
        - docs
        - website
        - unknown
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, node version, device, and any relevant runtime flags
      placeholder: Windows 11, Node 22, Expo Go iOS, etc.

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste errors, stack traces, screenshots, or recordings
      render: shell
